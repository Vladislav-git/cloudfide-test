services:
  frontend:
    build:
      context: .
      args:
        # Requests come from the browser on the host, so use the published backend port.
        VITE_API_URL: "http://localhost:5001"
    container_name: modular-form-creator-frontend
    # Served on host port 5173 because that is the origin the backend's CORS allows.
    ports:
      - "5173:80"
    depends_on:
      - backend
  backend:
    build: ./backend
    container_name: modular-form-creator-backend
    ports:
      - "5001:5001"
    environment:
      PORT: "5001"
      MONGO_URI: "mongodb://mongo:27017/modular_form_creator"
      CORS_ORIGIN: "http://localhost:5173"
    depends_on:
      - mongo
  mongo:
    image: mongo:7
    container_name: modular-form-creator-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
