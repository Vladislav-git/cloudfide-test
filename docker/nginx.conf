server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets never change; cache them aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routing: unknown paths (e.g. /resources/1/details) get the SPA shell.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
